<div class="welcome">
  <div class="welcome-badge">
    <span class="badge-icon">📅</span>
    {{ badge() }}
  </div>

  <div class="welcome-company">
    <img src="bitrix24-logo.svg" alt="" class="company-logo" />
    <span class="company-name">Битрикс<span class="company-24">24</span></span>
  </div>
  <div class="welcome-illustration">👋</div>

  <h1 class="welcome-title">
    @if (userName()) {
      Привет, <span class="highlight">{{ userName() }}</span>!
    } @else {
      Привет!
    }
  </h1>

  <p class="welcome-text">{{ text() }}</p>

  <div class="welcome-meta">
    <div class="meta-item">
      <div class="meta-icon">⏱</div>
      <span>~3 минуты</span>
    </div>
    <div class="meta-item">
      <div class="meta-icon">📋</div>
      <span>4 коротких шага</span>
    </div>
  </div>

  <button mat-flat-button class="start-btn" (click)="start.emit()">
    Начать опрос
    <span class="arrow">→</span>
  </button>
</div>
